services:

  # ── ForgeFabrik DevStudio Server ──────────────────────────────────────────
  devstudio:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgefabrik/devstudio:dev
    container_name: devstudio
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DEVSTUDIO_SERVER_HOST: "0.0.0.0"
      DEVSTUDIO_SERVER_PORT: "8080"
      DEVSTUDIO_LOG_JSON: "false"
      DEVSTUDIO_LOG_LEVEL: "debug"
    volumes:
      # Sandbox-Arbeitsverzeichnis: persistiert über Neustarts
      - sandbox_data:/tmp/devstudio/sandboxes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  sandbox_data:
    driver: local

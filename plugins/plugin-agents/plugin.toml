# ForgeFabrik Plugin Manifest
# BKG: Plugin-ID ist namespaced (forgefabrik.<domain>)

[plugin]
id      = "forgefabrik.agents"
version = "0.1.0"
kind    = "runtime-plugin"
author  = "ForgeFabrik"

[plugin.capabilities]
role_requirements  = true
role_architecture  = true
role_coding        = true
role_testing       = true
role_security      = true
role_deployment    = true
consensus_voting   = true

[plugin.hooks]
on_task_created = "try_claim"
on_task_updated = "recheck_consensus"

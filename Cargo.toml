# ForgeFabrik DevStudio — Cargo Workspace
#
# BKG-Prinzipien:
#   foundation  →  Typen, Events, Fehlerverträge  (kein Infra, keine Logik)
#   domain      →  Fachdomänen, one concept = one crate
#   runtime     →  Infrastruktur, I/O, Außenwelt
#
# Dependency-Richtung:  foundation  ←  domain  ←  runtime
# Crate-Namen:          konzeptname, kein Projekt-Präfix

[workspace]
members = [
    # ── foundation ──────────────────────────────────────────────────────────
    "foundation/types",       # primitive Typen, IDs, Datenstrukturen
    "foundation/events",      # Event-Definitionen (Wahrheit des Systems)
    "foundation/errors",      # Fehlerverträge
    # ── domain ──────────────────────────────────────────────────────────────
    "domain/world",           # Voxel-Welt, WorldState, Koordinaten-Mapping
    "domain/agents",          # DevRolePlugin, 6 Rollen, Orchestrator
    "domain/security",        # Scanner, Regeln, Findings
    "domain/deployment",      # Deployment-Pipeline, Konsenslogik
    # ── runtime ─────────────────────────────────────────────────────────────
    "runtime/config",         # Settings-Loader (env-basiert)
    "runtime/store",          # Store-Trait + MemoryStore + PostgresStore
    "runtime/queue",          # TaskQueue-Trait + MemoryQueue
    "runtime/sandbox",        # SandboxManager-Trait + Local/Docker
    "runtime/api",            # HTTP/Axum: Router, Handler, AppState
    "runtime/drivers",        # Infrastruktur-Adapter: LLM I/O, Provider-Routing
    "runtime/server",         # Binary-Einstiegspunkt
    # ── plugins (nur Domain-Behavior-Erweiterungen, kein I/O) ───────────────
    "plugins/plugin-world",   # forgefabrik.world   — Voxel-Welt (cdylib)
    "plugins/plugin-agents",  # forgefabrik.agents  — AI-Agenten (cdylib)
    "plugins/plugin-gm",      # forgefabrik.gm      — Game Master (cdylib)
    "plugins/plugin-economy", # forgefabrik.economy — Ökonomie   (cdylib)
    # DEPRECATED: plugins/plugin-llm-free → ersetzt durch runtime/drivers/llm
]
resolver = "2"

# ── Gemeinsame Versionen (Single Source of Truth) ─────────────────────────
[workspace.dependencies]
# Async
tokio        = { version = "1",    features = ["full"] }
tokio-util   = { version = "0.7",  features = ["full"] }
tokio-stream = { version = "0.1",  features = ["sync"] }
futures      = "0.3"
async-trait  = "0.1"
# HTTP
axum         = { version = "0.8",  features = ["ws", "macros"] }
tower        = { version = "0.5",  features = ["util"] }
tower-http   = { version = "0.6",  features = ["cors","trace","request-id","timeout","compression-gzip"] }
axum-extra   = { version = "0.9",  features = ["typed-header"] }
# Serialization
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
# Storage
sqlx         = { version = "0.8",  features = ["runtime-tokio-rustls","migrate","uuid","chrono","json","postgres","sqlite"] }
redis        = { version = "0.27", features = ["tokio-comp","aio","streams"] }
dashmap      = "5"
# Docker (kein System-OpenSSL)
bollard      = { version = "0.17", default-features = false, features = ["rustls"] }
# HTTP-Client (kein System-OpenSSL)
reqwest      = { version = "0.12", default-features = false, features = ["json","stream","rustls-tls"] }
# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","json"] }
# Utilities
uuid         = { version = "1",    features = ["v4","serde"] }
chrono       = { version = "0.4",  features = ["serde"] }
thiserror    = "2"
anyhow       = "1"
bytes        = "1"
once_cell    = "1"
dotenvy      = "0.15"
rand         = "0.8"
sha2         = "0.10"
hex          = "0.4"
blake3       = "1"
parking_lot  = "0.12"
# Auth
argon2       = "0.5"
jsonwebtoken = "9"
# Dev
axum-test    = "20"
tokio-test   = "0.4"
mockall      = "0.13"
tempfile     = "3"
wiremock     = "0.6"

# ── Interne Crate-Pfade ────────────────────────────────────────────────────
types      = { path = "foundation/types" }
events     = { path = "foundation/events" }
errors     = { path = "foundation/errors" }
world      = { path = "domain/world" }
agents     = { path = "domain/agents" }
security   = { path = "domain/security" }
deployment = { path = "domain/deployment" }
store      = { path = "runtime/store" }
queue      = { path = "runtime/queue" }
sandbox    = { path = "runtime/sandbox" }
api        = { path = "runtime/api" }
drivers    = { path = "runtime/drivers" }
# 'config' und 'server' werden direkt per Pfad referenziert (Namenskonflikt vermeiden)

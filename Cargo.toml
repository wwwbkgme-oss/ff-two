# ForgeFabrik DevStudio — Cargo workspace
# Root is workspace-only (no [package]).
# One Concept, One Crate: each domain concern lives in exactly one crate.

[workspace]
members = [
    "crates/types",       # Domain models — Single Source of Truth
    "crates/errors",      # AppError, AppResult
    "crates/config",      # Settings
    "crates/store",       # Store trait + MemoryStore
    "crates/queue",       # TaskQueue trait + MemoryQueue
    "crates/world",       # WorldState + Voxel engine
    "crates/sandbox",     # SandboxManager trait + Local/Docker impls
    "crates/security",    # Scanner + rules
    "crates/deployment",  # DeploymentManager
    "crates/agents",      # DevRolePlugin trait + 6 roles + Orchestrator
    "crates/api",         # Axum router, handlers, AppState
    "crates/server",      # Binary entry point
]
resolver = "2"

# ── Shared dependency versions (one version, one place) ───────────────────
[workspace.dependencies]
tokio              = { version = "1",    features = ["full"] }
axum               = { version = "0.8",  features = ["ws", "macros"] }
tower              = { version = "0.5",  features = ["util"] }
tower-http         = { version = "0.6",  features = ["cors","trace","request-id","timeout","compression-gzip"] }
axum-extra         = { version = "0.9",  features = ["typed-header"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
sqlx               = { version = "0.8",  features = ["runtime-tokio-rustls","migrate","uuid","chrono","json","postgres","sqlite"] }
redis              = { version = "0.27", features = ["tokio-comp","aio","streams"] }
bollard            = { version = "0.17", default-features = false, features = ["rustls"] }
reqwest            = { version = "0.12", default-features = false, features = ["json","stream","rustls-tls"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter","json"] }
uuid               = { version = "1",    features = ["v4","serde"] }
chrono             = { version = "0.4",  features = ["serde"] }
thiserror          = "2"
anyhow             = "1"
async-trait        = "0.1"
tokio-util         = { version = "0.7",  features = ["full"] }
futures            = "0.3"
tokio-stream       = { version = "0.1",  features = ["sync"] }
bytes              = "1"
once_cell          = "1"
dotenvy            = "0.15"
config             = "0.14"
rand               = "0.8"
sha2               = "0.10"
hex                = "0.4"
argon2             = "0.5"
jsonwebtoken       = "9"
dashmap            = "5"
parking_lot        = "0.12"
validator          = { version = "0.18", features = ["derive"] }
# Dev
axum-test          = "20"
tokio-test         = "0.4"
mockall            = "0.13"
tempfile           = "3"
wiremock           = "0.6"
# Internal crates (path deps — used by dependents)
devstudio-types      = { path = "crates/types" }
devstudio-errors     = { path = "crates/errors" }
devstudio-config     = { path = "crates/config" }
devstudio-store      = { path = "crates/store" }
devstudio-queue      = { path = "crates/queue" }
devstudio-world      = { path = "crates/world" }
devstudio-sandbox    = { path = "crates/sandbox" }
devstudio-security   = { path = "crates/security" }
devstudio-deployment = { path = "crates/deployment" }
devstudio-agents     = { path = "crates/agents" }
devstudio-api        = { path = "crates/api" }
